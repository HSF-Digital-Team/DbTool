name: Php CS
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run against'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  static:
    name: Static Code Analysis PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Run Coding Standard
        uses: HSF-Digital-Team/github-actions/coding-standard@main
        with:
          php_version: 8.4
          extensions: php,phtml
          path: .