name: Magento 2 Coding Standards Test
on:
  pull_request:
    branches:
      # Magebit Jenkins instance sometimes needed,
      # to test some features which resides on staging branch
      - main

permissions:
  contents: read

jobs:
  static:
    name: Static Code Analysis PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get changed files
        id: changed-files-yaml
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.php
            **/*.phtml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: imagick
          tools: composer:v2, cs2pr

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Hyva coding standard (stand-alone)
        if: steps.changed-files-yaml.outputs.any_changed == 'true'
        run: composer create-project --no-plugins --no-dev --no-interaction hyva-themes/hyva-coding-standard /tmp/hyva-cs

      - name: Validate code directory (Hyva)
        if: steps.changed-files-yaml.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files-yaml.outputs.all_changed_files }}
        run: |
          /tmp/hyva-cs/vendor/bin/phpcs --ignore=*/node_modules/* --standard=HyvaThemes --extensions=phtml,php --exclude=Generic.Files.LineLength,Magento2.Annotation.MethodAnnotationStructure ${{ env.ALL_CHANGED_FILES }}
        id: phpcs-output
